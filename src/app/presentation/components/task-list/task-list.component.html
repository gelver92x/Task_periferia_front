<section class="task-grid" aria-label="Tareas">

  @if (loading()) {
    <!-- Skeleton cards durante la carga — misma estructura que las cards reales -->
    @for (s of skeletons; track $index) {
      <div class="task-grid__skeleton" aria-hidden="true">
        <div class="skeleton-header">
          <div class="skeleton-block skeleton-badge"></div>
          <div class="skeleton-block skeleton-date"></div>
        </div>
        <div class="skeleton-block skeleton-title"></div>
        <div class="skeleton-block skeleton-desc"></div>
        <div class="skeleton-block skeleton-desc skeleton-desc--short"></div>
        <div class="skeleton-footer">
          <div class="skeleton-block skeleton-btn"></div>
          <div class="skeleton-block skeleton-btn"></div>
        </div>
      </div>
    }
  } @else if (tasks().length > 0) {
    @for (task of tasks(); track task.id) {
      <app-task-item
        [task]="task"
        (edit)="edit.emit($event)"
        (delete)="delete.emit($event)"
        (statusChange)="statusChange.emit($event)"
      />
    }
  } @else {
    <div class="task-grid__empty">
      <p class="task-grid__empty-icon" aria-hidden="true">✦</p>
      <h3>Sin tareas</h3>
      <p>Crea una tarea o ajusta el filtro.</p>
    </div>
  }

</section>
