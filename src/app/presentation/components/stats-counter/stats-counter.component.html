<section class="stats" aria-label="Task summary">
  <article class="stat">
    <span class="stat__value">{{ total() }}</span>
    <span class="stat__label">Total</span>
  </article>
  <article class="stat">
    <span class="stat__value">{{ pending() }}</span>
    <span class="stat__label">Pending</span>
  </article>
  <article class="stat">
    <span class="stat__value">{{ inProgress() }}</span>
    <span class="stat__label">In progress</span>
  </article>
  <article class="stat">
    <span class="stat__value">{{ done() }}</span>
    <span class="stat__label">Done</span>
  </article>
</section>
