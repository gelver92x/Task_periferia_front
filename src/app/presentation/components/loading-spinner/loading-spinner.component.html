@if (active()) {
  <div class="loading" [class.loading--overlay]="overlay()" role="status" aria-live="polite">
    <div class="loading__content">
      <div class="loading__ring" aria-hidden="true">
        <div></div><div></div><div></div><div></div>
      </div>
      <span class="loading__label">{{ label() }}</span>
      <div class="loading__progress" aria-hidden="true">
        <div class="loading__progress-bar"></div>
      </div>
    </div>
  </div>
}
