@if (open()) {
  <div class="modal-backdrop" role="presentation" (click)="cancelled.emit()">
    <section
      class="confirm-modal"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="'confirm-modal-title'"
      (click)="$event.stopPropagation()"
    >
      <header class="confirm-modal__header">
        <h2 id="confirm-modal-title">{{ title() }}</h2>
      </header>

      <p class="confirm-modal__message">{{ message() }}</p>

      <footer class="confirm-modal__actions">
        <button class="confirm-modal__button confirm-modal__button--ghost" type="button" (click)="cancelled.emit()">
          {{ cancelLabel() }}
        </button>
        <button
          class="confirm-modal__button"
          [class.confirm-modal__button--danger]="destructive()"
          type="button"
          (click)="confirmed.emit()"
        >
          {{ confirmLabel() }}
        </button>
      </footer>
    </section>
  </div>
}
