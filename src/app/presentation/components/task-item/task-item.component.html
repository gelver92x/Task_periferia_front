<article class="task-card" [class]="'task-card--' + task().status">

  <!-- Header: badge de estado + fecha -->
  <header class="task-card__header">
    <app-task-status-badge [status]="task().status" />
    @if (task().createdAt) {
      <time class="task-card__date">{{ task().createdAt | date: 'dd MMM' }}</time>
    }
  </header>

  <!-- Cuerpo: título y descripción -->
  <div class="task-card__body">
    <h3 class="task-card__title">{{ task().title }}</h3>
    @if (task().description) {
      <p class="task-card__description">{{ task().description }}</p>
    }
  </div>

  <!-- Footer: acciones -->
  <footer class="task-card__footer">
    <button
      class="task-card__btn task-card__btn--edit"
      type="button"
      aria-label="Editar tarea"
      (click)="edit.emit(task())"
    >
      Editar
    </button>
    <button
      class="task-card__btn task-card__btn--danger"
      type="button"
      aria-label="Eliminar tarea"
      (click)="delete.emit(task())"
    >
      Eliminar
    </button>
  </footer>

</article>
