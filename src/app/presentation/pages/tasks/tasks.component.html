<main class="tasks-page app-shell">
  <div class="tasks-page__inner">

    <!-- Navbar — solo brand, sin botón de acción -->
    <header class="tasks-page__header">
      <div class="tasks-page__brand">
        <div class="tasks-page__logo" aria-hidden="true">✦</div>
        <div class="tasks-page__brand-info">
          <h1>Gestor de Tareas</h1>
          <p>Vista operacional</p>
        </div>
      </div>
    </header>

    <!-- Section header: stats a la izquierda, acción primaria a la derecha -->
    <div class="tasks-page__section-header">
      <div class="tasks-page__stats">
        <app-stats-counter
          [total]="facade.totalTasks()"
          [pending]="facade.pendingTasks()"
          [inProgress]="facade.inProgressTasks()"
          [done]="facade.doneTasks()"
        />
      </div>

      <div class="tasks-page__section-actions">
        <button
          id="btn-create-task"
          class="tasks-page__primary"
          type="button"
          (click)="openCreateForm()"
        >
          <span aria-hidden="true">+</span>
          Nueva tarea
        </button>
      </div>
    </div>

    <!-- Filtros + búsqueda -->
    <div class="tasks-page__controls">
      <app-status-filter-bar
        [activeFilter]="facade.statusFilter()"
        (filterChange)="onFilterChange($event)"
      />
      <app-search-bar (queryChange)="facade.setSearchQuery($event)" />
    </div>

    @if (facade.error()) {
      <div class="tasks-page__error" role="alert">⚠ {{ facade.error() }}</div>
    }

    <!-- Grid de cards -->
    <app-task-list
      [tasks]="facade.filteredTasks()"
      [loading]="facade.loading()"
      [loadingMore]="facade.loadingMore()"
      [hasMore]="facade.hasMore()"
      (edit)="openEditForm($event)"
      (delete)="requestDelete($event)"
      (statusChange)="changeStatus($event)"
      (loadMore)="onLoadMore()"
    />

  </div>

  <!-- Modales -->
  <app-task-form-modal
    [open]="formOpen()"
    [task]="editingTask()"
    (saved)="saveTask($event)"
    (cancelled)="closeForm()"
  />

  <app-confirm-modal
    [open]="!!taskPendingDelete()"
    title="Eliminar tarea"
    [message]="'¿Eliminar &quot;' + (taskPendingDelete()?.title ?? 'esta tarea') + '&quot; permanentemente?'"
    confirmLabel="Eliminar"
    cancelLabel="Cancelar"
    [destructive]="true"
    (confirmed)="confirmDelete()"
    (cancelled)="taskPendingDelete.set(null)"
  />

</main>
